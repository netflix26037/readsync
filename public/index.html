<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadSync</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #161a22;
    --card-hover: #1c212b;
    --text: #f0f1f3;
    --muted: #9096a3;
    --accent: #4f7cff;
    --accent-soft: rgba(79,124,255,0.15);
    --border: #262b36;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }
  .site-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .site-header h1 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--text);
    margin-bottom: 8px;
    font-size: 15px;
  }
  button {
    padding: 10px 16px;
    border-radius: 9px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button.secondary { background: #262b36; color: var(--text); font-weight: 500; }
  button.small { padding: 6px 12px; font-size: 12.5px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 160px; }
  #app { display: none; }
  .muted { color: var(--muted); font-size: 13px; }
  .feed-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .badge {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-right: 8px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs button.active { background: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .article-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .article-card:hover { background: var(--card-hover); }
  .article-card.is-read { opacity: 0.4; }
  .article-card .thumb {
    width: 100%; height: 150px; object-fit: cover; background: #1c212b;
  }
  .article-card .thumb.placeholder {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
    background: linear-gradient(135deg, #1c212b, #0d0f14);
  }
  .article-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .pill.source { background: #262b36; color: var(--muted); }
  .article-body a.title {
    color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px; line-height: 1.4;
  }
  .article-body a.title:hover { color: var(--accent); }
  .article-body .snippet { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .article-body .orig-title { color: #5a6070; font-size: 11.5px; }
  .article-body .meta { color: var(--muted); font-size: 11.5px; }
  .article-actions { margin-top: auto; display: flex; justify-content: flex-end; }
  .error { color: #ff6b6b; font-size: 13px; margin-top: 4px; }
  .empty-state { text-align: center; padding: 40px 10px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <div id="auth" class="card">
    <h1 style="margin:0 0 6px;">ReadSync</h1>
    <p class="muted">قارئ مواضيع شخصي — أدخل رمز الدخول نفسه من أي جهاز لديك لمتابعة نفس قائمة المقروء/غير المقروء.</p>
    <input id="code" type="password" placeholder="رمز الدخول">
    <button onclick="doLogin()">دخول</button>
    <div id="authMsg" class="error"></div>
  </div>

  <div id="app">
    <div class="site-header">
      <h1>ReadSync</h1>
      <button class="secondary small" onclick="logout()">تسجيل الخروج</button>
    </div>

    <div class="card">
      <div class="row">
        <input id="feedUrl" placeholder="رابط RSS، مثال: https://hnrss.org/frontpage">
        <input id="feedCategory" placeholder="تصنيف (اختياري)، مثال: تقنية" style="max-width:180px;">
        <button onclick="addFeed()">إضافة</button>
      </div>
      <div id="feedList"></div>
    </div>

    <div class="tabs">
      <button id="tabAll" class="active" onclick="setFilter(false)">الكل</button>
      <button id="tabUnread" onclick="setFilter(true)">غير المقروء فقط</button>
      <button class="secondary" onclick="loadArticles()">تحديث</button>
    </div>

    <div id="articles" class="grid"></div>
  </div>

</div>

<script>
let token = localStorage.getItem('readsync_token');
let unreadOnly = false;

function authHeaders() {
  return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
}

async function doLogin() {
  const code = document.getElementById('code').value;
  const msg = document.getElementById('authMsg');
  msg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error || 'حدث خطأ'; return; }
    token = data.token;
    localStorage.setItem('readsync_token', token);
    showApp();
  } catch (e) {
    msg.textContent = 'تعذّر الاتصال بالسيرفر';
  }
}

function logout() {
  localStorage.removeItem('readsync_token');
  token = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth').style.display = 'block';
}

function showApp() {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadFeeds();
  loadArticles();
}

async function loadFeeds() {
  const res = await fetch('/api/feeds', { headers: authHeaders() });
  if (!res.ok) return;
  const feeds = await res.json();
  const el = document.getElementById('feedList');
  el.innerHTML = feeds.length ? '' : '<p class="muted">لا توجد مصادر بعد.</p>';
  feeds.forEach(f => {
    const div = document.createElement('div');
    div.className = 'feed-item';
    div.innerHTML = `
      <span><span class="badge">${escapeHtml(f.category || 'عام')}</span>${escapeHtml(f.title)}</span>
      <span>
        <button class="small secondary" onclick="refreshFeed('${f.id}')">تحديث</button>
        <button class="small secondary" onclick="deleteFeed('${f.id}')">حذف</button>
      </span>`;
    el.appendChild(div);
  });
}

async function addFeed() {
  const url = document.getElementById('feedUrl').value.trim();
  const category = document.getElementById('feedCategory').value.trim();
  if (!url) return;
  const res = await fetch('/api/feeds', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ url, category }) });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'تعذّرت إضافة المصدر'); return; }
  document.getElementById('feedUrl').value = '';
  document.getElementById('feedCategory').value = '';
  loadFeeds();
  loadArticles();
}

async function refreshFeed(id) {
  await fetch(`/api/feeds/${id}/refresh`, { method: 'POST', headers: authHeaders() });
  loadArticles();
}

async function deleteFeed(id) {
  await fetch(`/api/feeds/${id}`, { method: 'DELETE', headers: authHeaders() });
  loadFeeds();
  loadArticles();
}

function setFilter(val) {
  unreadOnly = val;
  document.getElementById('tabAll').classList.toggle('active', !val);
  document.getElementById('tabUnread').classList.toggle('active', val);
  loadArticles();
}

async function loadArticles() {
  const res = await fetch('/api/articles?unreadOnly=' + unreadOnly, { headers: authHeaders() });
  if (!res.ok) return;
  const articles = await res.json();
  const el = document.getElementById('articles');
  if (!articles.length) {
    el.innerHTML = '<div class="empty-state">لا توجد مواضيع بعد — أضف مصدرًا أعلاه.</div>';
    return;
  }
  el.innerHTML = '';
  articles.forEach(a => {
    const card = document.createElement('div');
    card.className = 'article-card' + (a.read ? ' is-read' : '');
    const date = new Date(a.publishedAt).toLocaleString('ar');

    const thumb = a.image
      ? `<img class="thumb" src="${a.image}" onerror="this.style.display='none'">`
      : `<div class="thumb placeholder">لا توجد صورة</div>`;

    card.innerHTML = `
      ${thumb}
      <div class="article-body">
        <div class="badges">
          <span class="pill">${escapeHtml(a.category || 'عام')}</span>
          <span class="pill source">${escapeHtml(a.feedTitle || '')}</span>
        </div>
        <a class="title" href="${a.link}" target="_blank" onclick="markRead('${a.id}', true)">
          ${escapeHtml(a.arabicTitle || a.title)}
        </a>
        <div class="orig-title">${escapeHtml(a.title)}</div>
        <div class="snippet">${escapeHtml(a.arabicSnippet || a.snippet || '')}</div>
        <div class="meta">${date}</div>
        <div class="article-actions">
          <button class="small secondary" onclick="markRead('${a.id}', ${!a.read})">
            ${a.read ? 'وضع كغير مقروء' : 'وضع كمقروء'}
          </button>
        </div>
      </div>`;
    el.appendChild(card);
  });
}

async function markRead(articleId, read) {
  await fetch(`/api/articles/${articleId}/${read ? 'read' : 'unread'}`, { method: 'POST', headers: authHeaders() });
  loadArticles();
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Auto-login if we already have a token
if (token) {
  fetch('/api/feeds', { headers: authHeaders() })
    .then(res => res.ok ? showApp() : Promise.reject())
    .catch(() => { localStorage.removeItem('readsync_token'); token = null; });
}
</script>
</body>
</html>
